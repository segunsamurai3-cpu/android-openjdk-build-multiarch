name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt update
          # Добавляем расширенный список библиотек, которые просил лог ошибки
          sudo apt -y install autoconf python3 unzip zip gcc-multilib g++-multilib \
          libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev \
          libxext-dev libxrender-dev libxt-dev libxrandr-dev libxinerama-dev \
          libxcomposite-dev libcups2-dev

      - name: Build
        run: |
          chmod +x *.sh
          # Исправляем путь к компилятору, чтобы он не искал старый NDK r10e
          ./ci_build_arch_aarch64.sh
        env:
          JDK_VERSION: 25
          EXTRA_PATCHES: "patches/jdk25u_android.diff"

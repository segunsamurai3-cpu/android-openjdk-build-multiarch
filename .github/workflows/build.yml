name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt -y install autoconf bash build-essential openjdk-21-jdk \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Boot JDK (Java 24)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 -b jdk-25+0 https://github.com/openjdk/jdk jdk-source

      - name: Download Real X11 Libs (ARM64)
        run: |
          mkdir -p x11-arm64
          cd x11-arm64
          # Скачиваем основные пакеты напрямую с серверов Ubuntu Ports
          URL="http://ports.ubuntu.com/ubuntu-ports/pool/main/libx/libx11/libx11-6_1.8.7-1_arm64.deb"
          URL2="http://ports.ubuntu.com/ubuntu-ports/pool/main/libx/libx11/libx11-dev_1.8.7-1_arm64.deb"
          URL3="http://ports.ubuntu.com/ubuntu-ports/pool/main/x/xorgproto/x11proto-dev_2023.2-1_all.deb"
          curl -L -O $URL && curl -L -O $URL2 && curl -L -O $URL3
          # Распаковываем их без установки в систему
          for f in *.deb; do dpkg-deb -x $f .; done
          # Создаем структуру, которую поймет OpenJDK
          mv usr/lib/aarch64-linux-gnu lib
          mv usr/include include

      - name: Apply Patch
        run: |
          cd jdk-source
          patch -p1 < ../patches/jdk25u_android.diff || echo "Patch failed, skip"

      - name: Configure OpenJDK
        run: |
          cd jdk-source
          bash configure \
            --openjdk-target=aarch64-linux-gnu \
            --with-boot-jdk=$JAVA_HOME \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --enable-headless-only \
            --with-jvm-variants=server \
            --with-native-debug-symbols=none \
            --with-freetype=bundled \
            --with-x-include=$(pwd)/../x11-arm64/include \
            --with-x-libraries=$(pwd)/../x11-arm64/lib \
            --with-x=yes
          
      - name: Build Images
        run: |
          cd jdk-source
          make images
          
      - name: Archive and Upload
        if: success()
        run: |
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final-AArch64
          path: jdk25-android-aarch64.tar.xz

name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt -y install autoconf bash build-essential openjdk-21-jdk \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Boot JDK (Java 24)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 -b jdk-25+0 https://github.com/openjdk/jdk jdk-source

      - name: Force Inject Everything (ARM64)
        run: |
          mkdir -p deps-tmp && cd deps-tmp
          BASE_URL="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          
          # Полный список "запчастей"
          PKGS=(
            "libx/libx11/libx11-dev_1.8.7-1build1_arm64.deb"
            "libx/libx11/libx11-6_1.8.7-1build1_arm64.deb"
            "x/xorgproto/x11proto-dev_2023.2-1_all.deb"
            "libx/libxext/libxext-dev_1.3.4-1build2_arm64.deb"
            "libx/libxrender/libxrender-dev_0.9.10-1.1build1_arm64.deb"
            "libx/libxtst/libxtst-dev_1.2.3-1build4_arm64.deb"
            "a/alsa-lib/libasound2-dev_1.2.11-1build2_arm64.deb"
            "c/cups/libcups2-dev_2.4.7-1.2ubuntu7_arm64.deb"
            "f/fontconfig/libfontconfig-dev_2.15.0-1.1ubuntu2_arm64.deb"
            "libf/libffi/libffi-dev_3.4.6-1_arm64.deb"
          )
          
          for pkg in "${PKGS[@]}"; do curl -L -O "$BASE_URL/$pkg"; done
          for f in *.deb; do dpkg-deb -x $f .; done
          
          # Инъекция в системные пути
          sudo cp -r usr/include/* /usr/include/aarch64-linux-gnu/ || true
          sudo cp -r usr/lib/aarch64-linux-gnu/* /usr/lib/aarch64-linux-gnu/ || true
          
          # Фикс иерархии
          for dir in alsa cups fontconfig X11; do
            sudo mkdir -p /usr/include/$dir
            [ -d usr/include/$dir ] && sudo cp -r usr/include/$dir/* /usr/include/$dir/ || true
          done

      - name: Configure OpenJDK
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          C_INCLUDE_PATH: /usr/include/aarch64-linux-gnu
          CPLUS_INCLUDE_PATH: /usr/include/aarch64-linux-gnu
          LIBRARY_PATH: /usr/lib/aarch64-linux-gnu
        run: |
          cd jdk-source
          bash configure \
            --openjdk-target=aarch64-linux-gnu \
            --with-boot-jdk=$JAVA_HOME \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --with-native-debug-symbols=none \
            --enable-headless-only \
            --disable-warnings-as-errors \
            --with-freetype=bundled \
            --with-zlib=bundled \
            --with-libpng=bundled \
            --with-libjpeg=bundled \
            --with-giflib=bundled \
            --with-lcms=bundled \
            --with-harfbuzz=bundled \
            --with-libffi=bundled \
            --with-extra-cflags="-O3 -march=armv8-a" \
            --with-extra-cxxflags="-O3 -march=armv8-a"
          
      - name: Build Images
        run: |
          cd jdk-source
          make images
          
      - name: Archive and Upload
        if: success()
        run: |
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final-AArch64
          path: jdk25-android-aarch64.tar.xz

name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt -y install autoconf bash build-essential openjdk-21-jdk \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Boot JDK (Java 24)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 -b jdk-25+0 https://github.com/openjdk/jdk jdk-source

      - name: Download X11 Libs via APT (No 404 error)
        run: |
          mkdir -p x11-arm64/libs
          cd x11-arm64
          # Скачиваем пакеты через apt-get download, это надежнее прямых ссылок
          sudo apt-get update
          apt-get download libx11-6:arm64 libx11-dev:arm64 x11proto-dev || \
          (echo "Fallback to direct download..." && \
           curl -L -o x1.deb http://ports.ubuntu.com/ubuntu-ports/pool/main/libx/libx11/libx11-dev_1.8.7-1build1_arm64.deb && \
           curl -L -o x2.deb http://ports.ubuntu.com/ubuntu-ports/pool/main/libx/libx11/libx11-6_1.8.7-1build1_arm64.deb && \
           curl -L -o x3.deb http://ports.ubuntu.com/ubuntu-ports/pool/main/x/xorgproto/x11proto-dev_2023.2-1_all.deb)
          
          # Распаковываем всё, что нашли
          for f in *.deb; do dpkg-deb -x $f .; done
          
          # Подготавливаем пути для компилятора
          mkdir -p ./lib
          cp -r usr/lib/aarch64-linux-gnu/* ./lib/ || cp -r usr/lib/* ./lib/ || true
          cp -r usr/include ./include

      - name: Apply Patch
        run: |
          cd jdk-source
          patch -p1 < ../patches/jdk25u_android.diff || echo "Patch skip"

      - name: Configure OpenJDK
        run: |
          cd jdk-source
          bash configure \
            --openjdk-target=aarch64-linux-gnu \
            --with-boot-jdk=$JAVA_HOME \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --enable-headless-only \
            --with-jvm-variants=server \
            --with-native-debug-symbols=none \
            --with-freetype=bundled \
            --with-x-include=$(pwd)/../x11-arm64/include \
            --with-x-libraries=$(pwd)/../x11-arm64/lib \
            --with-x=yes
          
      - name: Build Images
        run: |
          cd jdk-source
          make images
          
      - name: Archive and Upload
        if: success()
        run: |
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final-AArch64
          path: jdk25-android-aarch64.tar.xz

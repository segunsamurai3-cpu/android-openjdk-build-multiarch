name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt -y install autoconf bash build-essential openjdk-21-jdk \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Boot JDK (Java 24)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 -b jdk-25+0 https://github.com/openjdk/jdk jdk-source

      - name: Force Inject Dependencies (ARM64)
        run: |
          mkdir -p deps-tmp && cd deps-tmp
          sudo dpkg --add-architecture arm64
          
          # Настройка репозиториев Ports для ARM64
          sudo bash -c 'cat <<EOF > /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          EOF'
          sudo sed -i "s/deb http/deb [arch=amd64] http/g" /etc/apt/sources.list.d/ubuntu.sources || true
          
          sudo apt-get update || true
          
          # Скачиваем Fontconfig и связанные библиотеки
          apt-get download \
            libx11-dev:arm64 libxext-dev:arm64 libxrender-dev:arm64 \
            libxtst-dev:arm64 libasound2-dev:arm64 libcups2-dev:arm64 \
            libfontconfig-dev:arm64 libfontconfig1:arm64 \
            libfreetype-dev:arm64 libffi-dev:arm64 x11proto-dev
          
          for f in *.deb; do dpkg-deb -x $f .; done
          
          # Массовое копирование в пути кросс-компилятора
          sudo cp -r usr/include/* /usr/include/aarch64-linux-gnu/ || true
          sudo cp -r usr/lib/aarch64-linux-gnu/* /usr/lib/aarch64-linux-gnu/ || true
          
          # Специальный фикс для Fontconfig: он ищет либо в корне, либо в подпапке
          sudo mkdir -p /usr/include/fontconfig /usr/include/freetype2
          [ -d usr/include/fontconfig ] && sudo cp -r usr/include/fontconfig/* /usr/include/fontconfig/ || true
          [ -d usr/include/freetype2 ] && sudo cp -r usr/include/freetype2/* /usr/include/freetype2/ || true
          # Делаем копию freetype2 в стандартный путь, так как fontconfig.h часто его там ждет
          sudo cp -r /usr/include/freetype2/* /usr/include/ || true

      - name: Configure OpenJDK
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          C_INCLUDE_PATH: /usr/include/aarch64-linux-gnu:/usr/include/freetype2
          CPLUS_INCLUDE_PATH: /usr/include/aarch64-linux-gnu:/usr/include/freetype2
          LIBRARY_PATH: /usr/lib/aarch64-linux-gnu
        run: |
          cd jdk-source
          bash configure \
            --openjdk-target=aarch64-linux-gnu \
            --with-boot-jdk=$JAVA_HOME \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --with-native-debug-symbols=none \
            --enable-headless-only \
            --disable-warnings-as-errors \
            --with-freetype=bundled \
            --with-zlib=bundled \
            --with-libpng=bundled \
            --with-libjpeg=bundled \
            --with-giflib=bundled \
            --with-lcms=bundled \
            --with-harfbuzz=bundled \
            --with-libffi=bundled
          
      - name: Build Images
        run: |
          cd jdk-source
          make images
          
      - name: Archive and Upload
        if: success()
        run: |
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final-AArch64
          path: jdk25-android-aarch64.tar.xz

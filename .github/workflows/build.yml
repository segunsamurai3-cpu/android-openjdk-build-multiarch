
name: Build OpenJDK 25

on:
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Boot JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 unzip zip gcc-multilib g++-multilib libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev

      - name: Run Build Script
        run: |
          # Запускаем сборку для архитектуры телефона (aarch64)
          bash ci_build_arch_aarch64.sh
        env:
          JDK_VERSION: 25
          # Указываем скрипту использовать твой патч
          EXTRA_PATCHES: "patches/jdk25u_android.diff"

      - name: Upload Finished JRE
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Android-AArch64
          path: "*.tar.xz"

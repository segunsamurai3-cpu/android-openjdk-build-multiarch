name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt -y install autoconf bash build-essential libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev libcups2-dev libfontconfig1-dev libasound2-dev

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 https://github.com/openjdk/jdk jdk-source

      - name: Apply Your Patch
        run: |
          cd jdk-source
          # Применяем твой файл из папки patches
          patch -p1 < ../patches/jdk25u_android.diff || echo "Патч применился с предупреждениями или ошибками"

      - name: Configure and Build
        run: |
          cd jdk-source
          bash configure \
            --with-boot-jdk=/usr/lib/jvm/java-21-openjdk-amd64 \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --enable-headless-only \
            --with-openjdk-target=aarch64-linux-gnu
          make images
          
      - name: Archive Result
        run: |
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final
          path: jdk25-android-aarch64.tar.xz

name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt -y install autoconf bash build-essential openjdk-21-jdk \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Boot JDK (Java 24)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 -b jdk-25+0 https://github.com/openjdk/jdk jdk-source

      - name: Force Inject Dependencies (ARM64)
        run: |
          mkdir -p deps-tmp && cd deps-tmp
          # Добавляем архитектуру и обновляем списки пакетов
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          
          # Скачиваем реальные пакеты для ARM64
          apt-get download \
            libx11-dev:arm64 \
            libxext-dev:arm64 \
            libxrender-dev:arm64 \
            libxtst-dev:arm64 \
            libasound2-dev:arm64 \
            libcups2-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libffi-dev:arm64 \
            x11proto-dev
          
          # Распаковываем дебиан-пакеты в текущую папку
          for f in *.deb; do dpkg-deb -x $f .; done
          
          # Копируем заголовки и библиотеки в системные пути кросс-компилятора
          sudo cp -r usr/include/* /usr/include/aarch64-linux-gnu/ || true
          sudo cp -r usr/lib/aarch64-linux-gnu/* /usr/lib/aarch64-linux-gnu/ || true
          
          # Фикс структуры папок для Configure (чтобы видел alsa/asoundlib.h и т.д.)
          for dir in alsa cups fontconfig X11; do
            sudo mkdir -p /usr/include/$dir
            if [ -d usr/include/$dir ]; then
              sudo cp -r usr/include/$dir/* /usr/include/$dir/
            fi
          done

      - name: Configure OpenJDK
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          # Явные пути для компилятора, чтобы он "увидел" наши инъекции
          C_INCLUDE_PATH: /usr/include/aarch64-linux-gnu
          CPLUS_INCLUDE_PATH: /usr/include/aarch64-linux-gnu
          LIBRARY_PATH: /usr/lib/aarch64-linux-gnu
        run: |
          cd jdk-source
          bash configure \
            --openjdk-target=aarch64-linux-gnu \
            --with-boot-jdk=$JAVA_HOME \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --with-native-debug-symbols=none \
            --enable-headless-only \
            --disable-warnings-as-errors \
            --with-freetype=bundled \
            --with-zlib=bundled \
            --with-libpng=bundled \
            --with-libjpeg=bundled \
            --with-giflib=bundled \
            --with-lcms=bundled \
            --with-harfbuzz=bundled \
            --with-libffi=bundled
          
      - name: Build Images
        run: |
          cd jdk-source
          make images
          
      - name: Archive and Upload
        if: success()
        run: |
          # Ищем готовую сборку в папке build
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final-AArch64
          path: jdk25-android-aarch64.tar.xz

name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt -y install autoconf bash build-essential openjdk-21-jdk \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Boot JDK (Java 24)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 -b jdk-25+0 https://github.com/openjdk/jdk jdk-source

      - name: Force Inject All Dependencies (ARM64)
        run: |
          mkdir -p deps-tmp && cd deps-tmp
          BASE_URL="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          
          # Скачиваем X11, ALSA, CUPS и Fontconfig для ARM64
          curl -L -O "$BASE_URL/libx/libx11/libx11-dev_1.8.7-1build1_arm64.deb"
          curl -L -O "$BASE_URL/libx/libx11/libx11-6_1.8.7-1build1_arm64.deb"
          curl -L -O "$BASE_URL/x/xorgproto/x11proto-dev_2023.2-1_all.deb"
          curl -L -O "$BASE_URL/a/alsa-lib/libasound2-dev_1.2.11-1build2_arm64.deb"
          curl -L -O "$BASE_URL/a/alsa-lib/libasound2t64_1.2.11-1build2_arm64.deb"
          curl -L -O "$BASE_URL/c/cups/libcups2-dev_2.4.7-1.2ubuntu7_arm64.deb"
          curl -L -O "$BASE_URL/f/fontconfig/libfontconfig-dev_2.15.0-1.1ubuntu2_arm64.deb"
          
          for f in *.deb; do dpkg-deb -x $f .; done
          
          # Раскладываем файлы в системные пути кросс-компилятора
          sudo cp -r usr/include/* /usr/include/aarch64-linux-gnu/ || true
          sudo cp -r usr/lib/aarch64-linux-gnu/* /usr/lib/aarch64-linux-gnu/ || true
          
          # Фикс путей: некоторые пакеты кладут хидеры прямо в include, а не в подпапки
          sudo mkdir -p /usr/include/alsa /usr/include/cups
          [ -d usr/include/alsa ] && sudo cp -r usr/include/alsa/* /usr/include/alsa/ || true
          [ -d usr/include/cups ] && sudo cp -r usr/include/cups/* /usr/include/cups/ || true

      - name: Configure OpenJDK
        run: |
          cd jdk-source
          bash configure \
            --openjdk-target=aarch64-linux-gnu \
            --with-boot-jdk=$JAVA_HOME \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --enable-headless-only \
            --with-jvm-variants=server \
            --with-native-debug-symbols=none \
            --with-freetype=bundled \
            --with-zlib=bundled \
            --with-libpng=bundled \
            --with-libjpeg=bundled \
            --with-giflib=bundled \
            --with-lcms=bundled \
            --with-harfbuzz=bundled \
            --with-x=yes
          
      - name: Build Images
        run: |
          cd jdk-source
          make images
          
      - name: Archive and Upload
        if: success()
        run: |
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final-AArch64
          path: jdk25-android-aarch64.tar.xz

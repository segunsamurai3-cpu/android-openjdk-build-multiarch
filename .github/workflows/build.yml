name: Build OpenJDK 25
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools & Cross-Libs
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt -y install autoconf bash build-essential openjdk-21-jdk \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libx11-dev:arm64 libxext-dev:arm64 libxrender-dev:arm64 \
          libxtst-dev:arm64 libxt-dev:arm64 libcups2-dev:arm64 \
          libfontconfig1-dev:arm64 libasound2-dev:arm64 libfreetype6-dev:arm64

      - name: Setup Boot JDK (Java 24)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'

      - name: Clone OpenJDK 25
        run: |
          git clone --depth 1 -b jdk-25+0 https://github.com/openjdk/jdk jdk-source

      - name: Apply Patch
        run: |
          cd jdk-source
          patch -p1 < ../patches/jdk25u_android.diff || echo "Patch failed, continuing"

      - name: Configure OpenJDK
        run: |
          cd jdk-source
          bash configure \
            --openjdk-target=aarch64-linux-gnu \
            --with-boot-jdk=$JAVA_HOME \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --enable-headless-only \
            --with-jvm-variants=server \
            --with-native-debug-symbols=none \
            --with-freetype=system
          
      - name: Build Images
        run: |
          cd jdk-source
          make images
          
      - name: Archive and Upload
        if: success()
        run: |
          cd jdk-source/build/*/images
          tar -cJf ../../../../jdk25-android-aarch64.tar.xz jdk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Java25-Final-AArch64
          path: jdk25-android-aarch64.tar.xz

name: Build OpenJDK 25 for Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_android:
    strategy:
      matrix:
        arch: [ "aarch64", "x86_64" ]
      fail-fast: false

    name: "Build for Android ${{matrix.arch}}"
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Boot JDK)
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: zulu

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev gcc-multilib g++-multilib libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev

    - name: Build with CI build script
      run: |
        # Мы передаем переменную окружения, чтобы скрипт знал, что мы хотим JDK 25
        export JDK_VERSION=25
        bash "ci_build_arch_${{matrix.arch}}.sh"

    - name: Upload JDK build output
      uses: actions/upload-artifact@v4
      with:
        name: "jdk25-${{matrix.arch}}"
        path: jdk25*.tar.xz

    - name: Setup tmate session if failed
      if: ${{ failure() }}
      uses: mxschmitt/action-tmate@v3

    - name: Upload JRE build output
      uses: actions/upload-artifact@v4
      with:
        name: "jre25-${{matrix.arch}}"
        path: jre25*.tar.xz

  pojav:
    needs: build_android
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get jre25-aarch64
      uses: actions/download-artifact@v4
      with:
        name: jre25-aarch64
        path: pojav

    - name: Get jre25-x86_64
      uses: actions/download-artifact@v4
      with:
        name: jre25-x86_64
        path: pojav

    - name: Repack JRE
      run: |
        # Указываем скрипту перепаковки, что работаем с 25 версией
        bash "repackjre.sh" $GITHUB_WORKSPACE/pojav $GITHUB_WORKSPACE/pojav/jre25-pojav
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
          name: jre25-pojav
          path: pojav/jre25-pojav/*
